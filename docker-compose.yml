services:
  postgres:
    container_name: short_links_db
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./docker/setup.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data
    networks:
      - links

  redis:
    image: bitnami/redis:8.0.2
    container_name: short_links_redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - links
    volumes:
      - redis_data:/data

  short_links_api:
    build: .
    container_name: short_links
    env_file: .env
    ports:
      - 3333:3333
    depends_on:
      - postgres
      - redis
    networks:
      - links

networks:
  links:
    driver: bridge

volumes:
  pg_data:
