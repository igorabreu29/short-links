name: CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.7"
          cache: "pnpm"
      - run: pnpm i

      - name: Semantic Releases
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Generate tag
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ecr_role }}
          aws-region: ${{ vars.aws_region }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Gerar .env
        env:
          DATABASE_URL: postgresql://links_admin:npg_WKbsulQjk5Z9@ep-round-king-ad3jdso1-pooler.c-2.us-east-1.aws.neon.tech/short-links-db?sslmode=require&channel_binding=require
          NODE_ENV: prod
          REDIS_HOST: 3.235.6.163
          REDIS_PASSWORD: docker
          REDIS_PORT: 6379
          REDIS_DB: 0
        run: |
          {
            echo "NODE_ENV=$NODE_ENV"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "REDIS_HOST=$REDIS_HOST"
            echo "REDIS_PASSWORD=$REDIS_PASSWORD"
            echo "REDIS_PORT=$REDIS_PORT"
            echo "REDIS_DB=$REDIS_DB"
          } > .env

      - run: cat .env

      - name: Build and push docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.generate_tag.outputs.sha }}
        id: build-and-push
        run: |
          docker build -t $REGISTRY/short-links-api:$TAG .
          docker image tag $REGISTRY/short-links-api:$TAG $REGISTRY/short-links-api:latest
          docker push -a $REGISTRY/short-links-api
          IMAGE=$(echo $REGISTRY/short-links-api:$TAG)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        id: deploy-app-runner
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service: short-links-api
          image: ${{ steps.build-and-push.outputs.image }}
          access-role-arn: ${{ vars.app_runner_role }}
          region: ${{ vars.aws_region }}
          cpu: 1
          memory: 2
          port: 3333
          wait-for-service-stability-seconds: 180 # 3m

      - name: App Runner Check
        run: echo "App Runner running... ${{ steps.deploy-app-runner.outputs.service-url }}"

